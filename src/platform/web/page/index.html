<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BO1 Zombies</title>
<style>
  :root {
    --bg: #0b0c0d;
    --panel: #15171a;
    --text: #e8e6e3;
    --muted: #9a9894;
    --accent: #c8402b;
    --accent-hover: #e04a33;
    --error: #ff8a75;
    --line: #2a2d31;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: block;
    background: #000;
    outline: none;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    background: radial-gradient(ellipse at 50% 35%, #1d1512 0%, var(--bg) 70%);
  }
  #overlay[hidden] { display: none; }
  .panel {
    width: min(520px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px 28px 22px;
    box-sizing: border-box;
  }
  h1 {
    margin: 0 0 2px;
    font-size: 30px;
    letter-spacing: 0.04em;
    font-weight: 800;
    text-transform: uppercase;
  }
  h1 span { color: var(--accent); }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  #status { min-height: 42px; margin: 0 0 18px; color: var(--muted); }
  #status.error { color: var(--error); }
  #play {
    width: 100%;
    padding: 13px;
    font: inherit;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 7px;
    cursor: pointer;
  }
  #play:hover:not(:disabled) { background: var(--accent-hover); }
  #play:disabled { opacity: 0.45; cursor: default; }
  #play[hidden] { display: none; }
  #newtab { display: block; margin-top: 12px; text-align: center; color: var(--text); }
  #newtab[hidden] { display: none; }
  details { margin-top: 16px; color: var(--muted); font-size: 13px; }
  summary { cursor: pointer; }
  label { display: block; margin-top: 10px; }
  input[type=text] {
    width: 100%;
    box-sizing: border-box;
    margin-top: 4px;
    padding: 7px 9px;
    font: 13px ui-monospace, Menlo, Consolas, monospace;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 5px;
  }
  #log {
    max-height: 30vh;
    overflow: auto;
    margin: 14px 0 0;
    padding: 8px;
    font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace;
    color: var(--muted);
    background: var(--bg);
    border-radius: 5px;
    white-space: pre-wrap;
  }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    padding: 8px 14px;
    font-size: 14px;
    color: var(--text);
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }
  #hint[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="screen" tabindex="0"></canvas>
<div id="hint" hidden>Click to use the mouse in the game</div>
<div id="overlay">
  <div class="panel">
    <h1>BO1 <span>Zombies</span></h1>
    <p class="sub">In the browser, from this computer's server. The game files stay on the server.</p>
    <p id="status">Checking this browser…</p>
    <button id="play" type="button">Play</button>
    <a id="newtab" target="_blank" rel="noopener" hidden>Open the game in a tab of its own</a>
    <details>
      <summary>Options</summary>
      <label><input type="checkbox" id="fullscreen"> Full screen</label>
      <label>Command line (as for the game: +set fs_game mods/&lt;name&gt; …; empty: the zombies menu)
        <input type="text" id="args" spellcheck="false" autocomplete="off" placeholder="+set bo1_zombies 1">
      </label>
    </details>
    <pre id="log" hidden></pre>
  </div>
</div>
<script src="bo1_page.js"></script>
</body>
</html>
